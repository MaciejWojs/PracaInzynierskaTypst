on:
  push:
    tags:
      - 'v*'

jobs:
  compile:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/maciejwojs/ubuntu-typst
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compile PDF
        run: |
          typst compile main.typ

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: main.pdf